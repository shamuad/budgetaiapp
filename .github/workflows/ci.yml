name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify workspace
        run: npm run verify

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Configure local AI test upstream
        run: cp supabase/functions/.env.example supabase/functions/.env

      - name: Start local Supabase
        run: supabase start

      - name: Rebuild database from migrations and seed
        run: supabase db reset

      - name: Smoke-test Edge Function startup
        run: curl --fail --silent --show-error --request OPTIONS http://127.0.0.1:54321/functions/v1/ask-gemini --output /dev/null

      - name: Test mobile auth recovery and user switching
        shell: bash
        run: |
          status_json="$(supabase status -o json)"
          api_url="$(jq -r '.API_URL // empty' <<<"$status_json")"
          anon_key="$(jq -r '.ANON_KEY // .PUBLISHABLE_KEY // empty' <<<"$status_json")"
          service_role_key="$(jq -r '.SERVICE_ROLE_KEY // .SECRET_KEY // empty' <<<"$status_json")"

          if [[ -z "$api_url" || -z "$anon_key" || -z "$service_role_key" ]]; then
            echo "Supabase local credentials were not available."
            exit 1
          fi

          SUPABASE_URL="$api_url" \
          SUPABASE_ANON_KEY="$anon_key" \
          SUPABASE_SERVICE_ROLE_KEY="$service_role_key" \
          npm run test:integration:auth

      - name: Test voice and receipt AI flows
        shell: bash
        run: |
          status_json="$(supabase status -o json)"
          api_url="$(jq -r '.API_URL // empty' <<<"$status_json")"
          anon_key="$(jq -r '.ANON_KEY // .PUBLISHABLE_KEY // empty' <<<"$status_json")"
          service_role_key="$(jq -r '.SERVICE_ROLE_KEY // .SECRET_KEY // empty' <<<"$status_json")"

          if [[ -z "$api_url" || -z "$anon_key" || -z "$service_role_key" ]]; then
            echo "Supabase local credentials were not available."
            exit 1
          fi

          SUPABASE_URL="$api_url" \
          SUPABASE_ANON_KEY="$anon_key" \
          SUPABASE_SERVICE_ROLE_KEY="$service_role_key" \
          npm run test:integration:ai-media

      - name: Test financial transaction lifecycle
        shell: bash
        run: |
          status_json="$(supabase status -o json)"
          SUPABASE_URL="$(jq -er '.API_URL' <<<"$status_json")" \
          SUPABASE_ANON_KEY="$(jq -er '.ANON_KEY // .PUBLISHABLE_KEY' <<<"$status_json")" \
          SUPABASE_SERVICE_ROLE_KEY="$(jq -er '.SERVICE_ROLE_KEY // .SECRET_KEY' <<<"$status_json")" \
          npm run test:integration:financial

      - name: Test schema, RLS isolation and request quotas
        run: supabase test db
